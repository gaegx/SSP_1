name: Lab2 CI

on:
  push:
    paths:
      - 'lab2/**'
      - '.github/workflows/lab2-ci.yml'
  pull_request:
    paths:
      - 'lab2/**'
      - '.github/workflows/lab2-ci.yml'

jobs:
  api-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab2/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: lab2/api/package-lock.json
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: node --test test/auth.unit.test.js
