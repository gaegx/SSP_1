services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: freelance
      POSTGRES_PASSWORD: freelance
      POSTGRES_DB: freelance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U freelance -d freelance']
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://freelance:freelance@db:5432/freelance
      PORT: 4000
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:-lab3-dev-secret}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@freelancedesk.local}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      ADMIN_EMAIL: admin@freelance.local
      ADMIN_PASSWORD: Admin123!
      LOG_LEVEL: info
    volumes:
      - uploads:/app/uploads
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - '3000:80'
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
