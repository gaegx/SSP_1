server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    client_max_body_size 6M;
  }

  location /uploads/ {
    proxy_pass http://api:4000/uploads/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
