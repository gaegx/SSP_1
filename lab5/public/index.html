<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Compare · GraphQL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@450;600;700&family=IBM+Plex+Mono:wght@450;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="logo">W</span>
          <div>
            <strong>Weather Compare</strong>
            <small>3 sources · GraphQL only</small>
          </div>
        </div>
        <div class="top-meta">
          <span id="status-pill" class="pill">…</span>
          <span id="total-pill" class="pill quiet">— readings</span>
          <a class="link" href="/graphql" target="_blank">GraphQL</a>
          <a class="link" href="/metrics" target="_blank">Metrics</a>
        </div>
      </header>

      <section class="sources" id="sources"></section>

      <section class="filters">
        <input id="search" placeholder="Search city / condition" />
        <select id="source">
          <option value="">All sources</option>
          <option value="open-meteo-forecast">open-meteo-forecast</option>
          <option value="open-meteo-archive">open-meteo-archive</option>
          <option value="met-norway">met-norway</option>
          <option value="local">local</option>
        </select>
        <input id="country" placeholder="Country (RU, US…)" maxlength="4" />
        <input id="minTemp" type="number" step="1" placeholder="Min °C" />
        <select id="sortBy">
          <option value="OBSERVED_AT">Sort: time</option>
          <option value="TEMPERATURE">Sort: temperature</option>
          <option value="HUMIDITY">Sort: humidity</option>
          <option value="WIND">Sort: wind</option>
          <option value="SOURCE">Sort: source</option>
          <option value="TITLE">Sort: title</option>
        </select>
        <select id="sortDir">
          <option value="DESC">DESC</option>
          <option value="ASC">ASC</option>
        </select>
        <label class="check"><input id="deep" type="checkbox" checked /> Nested city.readings</label>
        <button id="btn-load" type="button">Apply</button>
      </section>

      <section class="compare" aria-label="Сравнение источников">
        <div class="compare-head">
          <div>
            <p class="compare-kicker">Сравнение источников</p>
            <h2 id="compare-title">Выбери город</h2>
          </div>
          <div class="compare-controls">
            <select id="compare-city"></select>
            <button id="btn-compare" type="button">Сравнить</button>
          </div>
        </div>
        <div id="compare-spread" class="spread-banner hidden">
          <span class="spread-label">Разброс между API</span>
          <strong id="spread-value">—</strong>
          <span id="spread-hint" class="spread-hint"></span>
        </div>
        <div id="compare-out" class="compare-grid">
          <div class="compare-empty">Нажми «Сравнить» — покажем avg / min / max / latest °C по каждому источнику.</div>
        </div>
      </section>

      <section class="toolbar">
        <div class="pager">
          <button id="prev" type="button" class="ghost">Prev</button>
          <span id="page-label">page 1</span>
          <button id="next" type="button" class="ghost">Next</button>
        </div>
        <div class="mut">
          <input id="note-title" placeholder="addNote" />
          <button id="btn-note" type="button" class="ghost">Add</button>
          <button id="btn-refresh" type="button" class="ghost">Refresh data</button>
        </div>
        <div id="trace" class="trace">trace —</div>
      </section>

      <main id="list" class="grid"></main>
      <p id="err" class="err" hidden></p>

      <footer class="foot">
        <span>UI → :4005 → readings :4001 · cities :4002 · ops :4003</span>
        <span id="foot-metrics">metrics —</span>
      </footer>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
