<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 5 · GraphQL Catalog</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <p class="eyebrow">Lab 5 · только GraphQL</p>
          <h1>Каталог из 3 источников</h1>
        </div>
        <div id="meta" class="meta">загрузка…</div>
      </header>

      <section class="toolbar panel">
        <input id="search" placeholder="Поиск…" />
        <select id="source">
          <option value="">Все источники</option>
          <option value="jsonplaceholder">jsonplaceholder</option>
          <option value="dummyjson">dummyjson</option>
          <option value="fakestore">fakestore</option>
          <option value="local">local</option>
        </select>
        <select id="sortBy">
          <option value="TITLE">Сорт: название</option>
          <option value="PRICE">Сорт: цена</option>
          <option value="RATING">Сорт: рейтинг</option>
          <option value="CREATED_AT">Сорт: дата</option>
        </select>
        <select id="sortDir">
          <option value="ASC">ASC</option>
          <option value="DESC">DESC</option>
        </select>
        <button id="btn-load" type="button">Найти</button>
        <button id="btn-refresh" type="button" class="ghost">refreshCatalog</button>
      </section>

      <section class="panel">
        <div class="pager">
          <button id="prev" type="button">←</button>
          <span id="page-label">стр. 1</span>
          <button id="next" type="button">→</button>
        </div>
        <div id="list" class="list"></div>
        <p id="err" class="err" hidden></p>
      </section>

      <p class="hint">
        Полный GraphQL playground:
        <a href="/graphql" target="_blank">/graphql</a>
        · метрики: <a href="/metrics" target="_blank">/metrics</a>
      </p>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
